[project]
name = "venturepath-voice-agent"
version = "0.1.0"
description = "VenturePath voice AI interviewer: a LiveKit Agents worker on Gemini Live (live part adapted from DeepInterview)."
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "livekit-agents==1.8.10",
    "livekit-plugins-google==1.8.10",
    "httpx>=0.28.1,<0.29",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
